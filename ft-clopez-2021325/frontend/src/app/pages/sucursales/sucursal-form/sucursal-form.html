<div class="encabezado">
  <div>
    <h2><i class="bi bi-building-add me-2"></i>{{ esEdicion() ? 'Editar sucursal' : 'Nueva sucursal' }}</h2>
    <p>Los campos marcados con <span class="text-danger">*</span> son obligatorios</p>
  </div>
  <a routerLink="/sucursales" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Regresar</a>
</div>

<div class="tarjeta p-4">
  @if (errorServidor()) {
    <div class="alert alert-danger">
      <i class="bi bi-x-circle me-1"></i>{{ errorServidor() }}
      @if (erroresCampos().length) {
        <ul class="mb-0 mt-1">
          @for (e of erroresCampos(); track e.campo) { <li>{{ e.mensaje }}</li> }
        </ul>
      }
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()" novalidate>
    <div class="row g-3">
      <div class="col-md-8">
        <label for="nombre" class="form-label obligatorio">Nombre</label>
        <input id="nombre" type="text" class="form-control" formControlName="nombre" maxlength="100"
          placeholder="Ej. Agencia Central" [class.is-invalid]="invalido('nombre')">
        <app-error-campo [control]="form.controls.nombre" etiqueta="El nombre" />
      </div>

      <div class="col-md-4">
        <label for="telefono" class="form-label obligatorio">Teléfono</label>
        <input id="telefono" type="text" inputmode="numeric" class="form-control" formControlName="telefono" maxlength="8"
          placeholder="8 dígitos" [class.is-invalid]="invalido('telefono')">
        <app-error-campo [control]="form.controls.telefono" etiqueta="El teléfono" mensajePatron="El teléfono debe tener 8 dígitos numéricos." />
      </div>

      <div class="col-12">
        <label for="direccion" class="form-label obligatorio">Dirección</label>
        <input id="direccion" type="text" class="form-control" formControlName="direccion" maxlength="200"
          placeholder="Ej. 7a. avenida 10-25, zona 1" [class.is-invalid]="invalido('direccion')">
        <app-error-campo [control]="form.controls.direccion" etiqueta="La dirección" />
      </div>
    </div>

    <hr class="my-4">

    <div class="d-flex justify-content-end gap-2">
      <a routerLink="/sucursales" class="btn btn-outline-secondary">Cancelar</a>
      <button type="submit" class="btn btn-primary" [disabled]="guardando()">
        @if (guardando()) { <span class="spinner-border spinner-border-sm me-1"></span> } @else { <i class="bi bi-save me-1"></i> }
        {{ esEdicion() ? 'Actualizar' : 'Guardar' }}
      </button>
    </div>
  </form>
</div>
