<div class="encabezado">
  <div>
    <h2><i class="bi bi-person-plus me-2"></i>{{ esEdicion() ? 'Editar empleado' : 'Nuevo empleado' }}</h2>
    <p>Los campos marcados con <span class="text-danger">*</span> son obligatorios</p>
  </div>
  <a routerLink="/empleados" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Regresar</a>
</div>

<div class="tarjeta p-4">
  @if (errorServidor()) {
    <div class="alert alert-danger">
      <i class="bi bi-x-circle me-1"></i>{{ errorServidor() }}
      @if (erroresCampos().length) {
        <ul class="mb-0 mt-1">
          @for (e of erroresCampos(); track e.campo) { <li>{{ e.mensaje }}</li> }
        </ul>
      }
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()" novalidate>
    <div class="row g-3">
      <div class="col-md-6">
        <label for="nombre" class="form-label obligatorio">Nombre</label>
        <input id="nombre" type="text" class="form-control" formControlName="nombre" maxlength="50"
          placeholder="Ej. Luis" [class.is-invalid]="invalido('nombre')">
        <app-error-campo [control]="form.controls.nombre" etiqueta="El nombre" mensajePatron="El nombre solo puede contener letras." />
      </div>

      <div class="col-md-6">
        <label for="apellido" class="form-label obligatorio">Apellido</label>
        <input id="apellido" type="text" class="form-control" formControlName="apellido" maxlength="50"
          placeholder="Ej. Ramírez" [class.is-invalid]="invalido('apellido')">
        <app-error-campo [control]="form.controls.apellido" etiqueta="El apellido" mensajePatron="El apellido solo puede contener letras." />
      </div>

      <div class="col-md-4">
        <label for="puesto" class="form-label obligatorio">Puesto</label>
        <select id="puesto" class="form-select" formControlName="puesto" [class.is-invalid]="invalido('puesto')">
          <option value="" disabled>Seleccione un puesto</option>
          @for (p of puestos(); track p) {
            <option [value]="p">{{ p }}</option>
          }
        </select>
        <app-error-campo [control]="form.controls.puesto" etiqueta="El puesto" />
      </div>

      <div class="col-md-4">
        <label for="telefono" class="form-label obligatorio">Teléfono</label>
        <input id="telefono" type="text" inputmode="numeric" class="form-control" formControlName="telefono" maxlength="8"
          placeholder="8 dígitos" [class.is-invalid]="invalido('telefono')">
        <app-error-campo [control]="form.controls.telefono" etiqueta="El teléfono" mensajePatron="El teléfono debe tener 8 dígitos numéricos." />
      </div>

      <div class="col-md-4">
        <label for="id_sucursal" class="form-label obligatorio">Sucursal</label>
        <select id="id_sucursal" class="form-select" formControlName="id_sucursal" [class.is-invalid]="invalido('id_sucursal')">
          <option [ngValue]="null" disabled>Seleccione una sucursal</option>
          @for (s of sucursales(); track s.id_sucursal) {
            <option [ngValue]="s.id_sucursal">{{ s.nombre }}</option>
          }
        </select>
        <app-error-campo [control]="form.controls.id_sucursal" etiqueta="La sucursal" />
      </div>
    </div>

    <hr class="my-4">

    <div class="d-flex justify-content-end gap-2">
      <a routerLink="/empleados" class="btn btn-outline-secondary">Cancelar</a>
      <button type="submit" class="btn btn-primary" [disabled]="guardando()">
        @if (guardando()) { <span class="spinner-border spinner-border-sm me-1"></span> } @else { <i class="bi bi-save me-1"></i> }
        {{ esEdicion() ? 'Actualizar' : 'Guardar' }}
      </button>
    </div>
  </form>
</div>
